    <script>
      // ==========================================
      // Problem 1: Area and Perimeter of a Circle
      // ==========================================
      {
        // Formulae:
        // Area = pi * r * r
        // Perimeter = 2 * pi * r

        let r = 5; // Example radius
        const pi = 3.14159;
        
        let area = pi * r * r;
        let perimeter = 2 * pi * r;

        console.log("--- Problem 1: Circle ---");
        console.log("Area:", area);
        console.log("Perimeter:", perimeter);
      }

      // ==========================================
      // Problem 2: Basic Arithmetic Operations
      // ==========================================
      {
        let a = 8;
        let b = 3;

        let sum = a + b;
        let diff = a - b;
        let product = a * b;
        let quotient = a / b;
        let remainder = a % b;

        console.log("--- Problem 2: Arithmetic ---");
        console.log("Sum:", sum);
        console.log("Difference:", diff);
        console.log("Product:", product);
        console.log("Quotient:", quotient);
        console.log("Remainder:", remainder);
      }

      // ==========================================
      // Problem 3: Switch Case (Age Check)
      // ==========================================
      {
        let n = 28;
        console.log("--- Problem 3: Age Check ---");
        switch (n) {
          case 28:
            console.log("I am young");
            break;
          default:
            console.log("I am not young");
        }
      }
    </script>

    <!--
Question:
Take two positive integers A and B.
Verify whether:

(A + B)^3 = A^3 + B^3 + 3A^2B + 3AB^2

Calculate:
1) LHS = (A + B)^3
2) RHS = A^3 + B^3 + 3A^2B + 3AB^2

Print LHS
Print RHS
Print VERIFIED if equal, otherwise NOT VERIFIED
-->

    <script>
      {
        console.log("--- Problem 4: Verify (A+B)^3 ---");
        let A = 4;
        let B = 5;

        // LHS
        let LHS = (A + B) ** 3;

        // RHS
        let RHS = A ** 3 + B ** 3 + 3 * (A ** 2) * B + 3 * A * (B ** 2);

        console.log("LHS:", LHS);
        console.log("RHS:", RHS);

        if (LHS === RHS) {
          console.log("VERIFIED");
        } else {
          console.log("NOT VERIFIED");
        }
      }
    </script>

    <!--
Question:
Given the number of a month (1–12),
print the number of days in that month.
Consider a non-leap year.

Input:
An integer M (1 <= M <= 12)

Output:
Number of days in that month
-->

    <script>
      {
        console.log("--- Problem 5: Days in Month ---");
        let M = 3; // Change month number here
        let days;

        switch (M) {
          case 1: case 3: case 5: case 7: case 8: case 10: case 12:
            days = 31;
            break;
          case 4: case 6: case 9: case 11:
            days = 30;
            break;
          case 2:
            days = 28; // Non-leap year
            break;
          default:
            days = "Invalid Month";
        }
        console.log(`Month ${M} has ${days} days.`);
      }
    </script>

    <!--
Question:
Gian and Suneo start with heights h1 and h2.
They grow every second with speeds v1 and v2.
Check if their heights will ever become equal.
Print true or false.
-->

    <script>
      {
        console.log("--- Problem 6: Height Comparison ---");
        let h1 = 4; // Gian height
        let h2 = 2; // Suneo height
        let v1 = 2; // Gian speed
        let v2 = 4; // Suneo speed

        let equal = false;

        // Check for up to 10000 seconds (safe limit)
        for (let t = 0; t <= 10000; t++) {
          let height1 = h1 + v1 * t;
          let height2 = h2 + v2 * t;

          if (height1 === height2) {
            equal = true;
            console.log(`Heights become equal at t=${t}`);
            break;
          }
        }

        console.log("Will heights be equal?", equal);
      }
    </script>
